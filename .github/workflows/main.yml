name: Build iOS App (Unsigned)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Go component
      run: |
        cd GoSpoofer
        ./make.sh

    - name: Build Unsigned iOS App
      run: |
        # 1. 只构建 Archive，不签名
        xcodebuild -project location-spoofer.xcodeproj \
          -scheme location-spoofer \
          -destination 'generic/platform=iOS' \
          -archivePath build/location-spoofer.xcarchive \
          clean archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        # 2. 手动创建 IPA 结构（绕过 exportArchive）
        mkdir -p build/ipa/Payload
        cp -r build/location-spoofer.xcarchive/Products/Applications/location-spoofer.app build/ipa/Payload/

        # 3. 压缩成 IPA
        cd build/ipa
        zip -qr location-spoofer.ipa Payload

    - name: Upload Unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: build/ipa/location-spoofer.ipa

    - name: Upload Entitlements Files
      uses: actions/upload-artifact@v4
      with:
        name: entitlements
        path: |
          Resources/location-spoofer.entitlements
          Tunnel/location-spoofer-tunnel.entitlements
