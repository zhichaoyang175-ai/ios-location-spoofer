name: Build iOS App with Xcodegen

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Xcodegen
      run: brew install xcodegen  # 在 macOS runner 上安装 Xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate  # 从 project.yml 生成 .xcodeproj

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'  # 更新为可用版本；如果需要，可改成 'latest-stable'

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'  # 如果 GoSpoofer 需要不同版本，请调整

    - name: Build Go component
      run: |
        cd GoSpoofer
        ./make.sh  # 编译 Go 部分（生成 libgolocationspoofer.a）

    - name: Decode and install certificate
      run: |
        echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > certificate.p12
        KEYCHAIN_PATH="$RUNNER_TEMP/login.keychain"
        security delete-keychain "$KEYCHAIN_PATH" || true  # 先删除现有钥匙链，如果不存在忽略
        security create-keychain -p pwd "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        security unlock-keychain -p pwd "$KEYCHAIN_PATH"
        security import certificate.p12 -k "$KEYCHAIN_PATH" -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

    - name: Decode and install provisioning profile
      run: |
        echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build iOS app
      run: |
        xcodebuild -project location-spoofer.xcodeproj \
          -scheme location-spoofer \
          -destination 'generic/platform=iOS' \
          -archivePath build/location-spoofer.xcarchive \
          clean archive \
          CODE_SIGN_IDENTITY="iPhone Developer" \
          PROVISIONING_PROFILE_SPECIFIER="YourProfileName" \  # 替换成你的 provisioning profile 名称
          DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}"

        xcodebuild -exportArchive \
          -archivePath build/location-spoofer.xcarchive \
          -exportOptionsPlist ExportOptions.plist \  # 确保仓库中有 ExportOptions.plist
          -exportPath build/ipa

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ipa-file
        path: build/ipa/*.ipa  # 下载生成的 IPA 文件
